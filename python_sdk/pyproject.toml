[build-system]
requires = [
    "setuptools == 83.0.0",
    "setuptools-scm == 8.3.1"
]
build-backend = "setuptools.build_meta"

[project]
name = "reality_capture"
# PEP440, see https://peps.python.org/pep-0440/
version = "2.7.0"
authors = [
  { name="Bentley Systems" },
]
description = "This package contains a SDK for Reality Modeling, Reality Analysis and Reality Conversion iTwin APIs as well as Reality Management API utils. It provides classes, functions and examples to upload local data to ContextShare, run jobs and download the results."
readme = "README.md"
license =  {text = "MIT"}
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3.10", 
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
]
dependencies = [
    "bottle >= 0.12",
    "oauthlib >= 3.2",
    "requests-oauthlib >= 1.3.1",
    "certifi >= 2024.8.30",
    "azure-storage-blob >= 12.9",
    "pydantic >= 2.10.4"
]

[project.optional-dependencies]
dev = [
    "Sphinx >= 8.1.3",
    "sphinx-rtd-theme >= 3.0.2",
    "myst-parser >= 4.0.0",
    "autodoc_pydantic >= 2.2.0",
    "pytest >= 8.3.4",
    "pytest-cov >= 6.0.0",
    "responses >= 0.25.6",
    "python-dotenv >= 1.1.0",
    "towncrier >= 26.9.0",
    "bump-my-version >= 1.5.1"
]

[project.urls]
"Homepage" = "https://github.com/iTwin/reality-capture/tree/main/python_sdk"
"Reality Analysis Api reference" = "https://developer.bentley.com/apis/realitydataanalysis/"
"Reality Modeling Api reference" = "https://developer.bentley.com/apis/contextcapture/"
"Reality Conversion Api reference" = "https://developer.bentley.com/apis/realityconversion/"
"Reality Management Api reference" = "https://developer.bentley.com/apis/reality-management/"

[tool.towncrier]
directory = "py_changes"
filename = "docs/changelog.rst"
package = "reality_capture"
issue_format = "`#{issue} <https://github.com/iTwin/reality-capture/pull/{issue}>`_"
title_format = "----\n\n{version}"

[tool.bumpversion]
current_version = "2.7.0"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]
search = "{current_version}"
replace = "{new_version}"
regex = false
ignore_missing_version = false
ignore_missing_files = false
tag = false
push_tag = false
sign_tags = false
tag_name = "{new_version}-py"
tag_message = "Bump version: {current_version} → {new_version}"
allow_dirty = true
commit = false
message = "Bump version: {current_version} → {new_version}"
moveable_tags = []
commit_args = ""
setup_hooks = []
pre_commit_hooks = []
post_commit_hooks = []
allow_shell_hooks = false

[[tool.bumpversion.files]]
filename = "docs/conf.py"
search = '"versions": ["latest", "{current_version}"'
replace = '"versions": ["latest", "{new_version}", "{current_version}"'

