name: (PyBuild) Build Python SDK

on:
  workflow_call:
    inputs:
      version-patch-artifact:
        description: "Optional artifact holding a git patch to apply before building (used by the publish pipeline)."
        required: false
        type: string
        default: ""

jobs:
  build_sdk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Download version patch
        if: inputs.version-patch-artifact != ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.version-patch-artifact }}

      - name: Apply version patch
        if: inputs.version-patch-artifact != ''
        run: |
          git apply --binary version-bump.patch
          rm -f version-bump.patch

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Create venv and build wheel
        working-directory: ./python_sdk
        run: |
          python -m venv venv
          . ./venv/bin/activate
          pip install build
          python -m build

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-sdk-wheel
          path: python_sdk/dist/*.whl
          overwrite: true

      - name: Install documentation dependencies
        working-directory: ./python_sdk
        run: |
          . ./venv/bin/activate
          pip install dist/*.whl
          pip install .[dev]

      - name: Build documentation
        working-directory: ./python_sdk/docs
        run: |
          . ../venv/bin/activate
          make html

      - name: Package documentation
        working-directory: ./python_sdk/docs
        run: |
          mkdir -p "User Guide/en"
          cp -r _build/html "User Guide/en/html5"
          zip -r Documentation.zip "User Guide"

      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-sdk-docs
          path: python_sdk/docs/Documentation.zip
          overwrite: true
