name: (RCRelease) Publish reality-capture Release

on: workflow_dispatch

# Both TypeScript release workflows push a version commit to the same branch: run them one at a time.
concurrency:
  group: typescript-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # Fail fast: without these secrets the pipeline would only fail at the publish step,
  # after the whole test matrix has run.
  verify_credentials:
    runs-on: ubuntu-latest
    steps:
      - name: Verify release credentials
        env:
          HAS_GH_TOKEN: ${{ secrets.IMJS_ADMIN_GH_TOKEN != '' }}
          HAS_NPM_TOKEN: ${{ secrets.NPMJS_PUBLISH_ITWIN != '' }}
        run: |
          if [ "$HAS_GH_TOKEN" != "true" ]; then
            echo "::error::The IMJS_ADMIN_GH_TOKEN secret is not configured. It is required to push the version bump commit and tag."
            exit 1
          fi
          if [ "$HAS_NPM_TOKEN" != "true" ]; then
            echo "::error::The NPMJS_PUBLISH_ITWIN secret is not configured. It is required to publish to npm."
            exit 1
          fi

  build_and_test_sdk:
    needs: verify_credentials
    strategy:
      matrix:
        node-version: [22.x, 24.15.0]
        os: [windows-latest, ubuntu-latest, macos-latest]
      fail-fast: false

    uses: ./.github/workflows/reality-capture-build-and-test.yml
    with:
      node-version: ${{ matrix.node-version }}
      os: ${{ matrix.os }}

  publish_release:
    needs: build_and_test_sdk
    uses: ./.github/workflows/reality-capture-pack-and-publish.yml
    secrets: inherit
    with:
      prerelease: false
