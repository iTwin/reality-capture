name: (RCPackPublish) Pack and publish reality-capture GitHub release

on:
  workflow_call:
    inputs:
      prerelease:
        required: true
        type: boolean

jobs:
  publish:
    runs-on: windows-latest

    steps:
      # Check out the exact commit that was built and tested by the caller workflow.
      - name: Checkout github repo (+ download lfs dependencies)
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          token: ${{ secrets.IMJS_ADMIN_GH_TOKEN }}
          lfs: true

      - name: Checkout LFS objects
        run: git lfs checkout

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        working-directory: ./typescript/packages/reality-capture
        run: pnpm install --frozen-lockfile=true

      - name: Build
        working-directory: ./typescript/packages/reality-capture
        run: pnpm build

      - name: Publish packages in npm
        working-directory: ./typescript/packages/reality-capture
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          git config --local user.email imodeljs-admin@users.noreply.github.com
          git config --local user.name imodeljs-admin
          if ("${{ inputs.prerelease }}" -eq "true") {
            # Snapshot release (x.y.z-dev-<datetime>) from pending changesets. Nothing is committed.
            pnpm version-bump-dev
            pnpm publish-packages-dev
          }
          else {
            # npm versions are immutable: push the version commit and tag first, so that a branch
            # that moved since this run started makes the push fail before anything is published.
            $branch = "${{ github.ref_name }}"
            git fetch --no-tags --depth=2 origin "refs/heads/$branch"
            $remoteHead = git rev-parse FETCH_HEAD
            if ($remoteHead -eq $env:GITHUB_SHA) {
              pnpm version-bump
              if (-not (git status --porcelain -- .)) { throw "No changeset to release" }
              $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
              $tag = "@itwin/reality-capture_v$version"
              git add -A -- .
              git commit -m "Version bump $tag [skip actions]"
              git tag $tag
              git push --atomic origin "HEAD:refs/heads/$branch" "refs/tags/$tag"
            }
            else {
              # Retry of a run whose version commit was pushed but not (fully) published.
              git checkout --detach FETCH_HEAD
              $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
              $tag = "@itwin/reality-capture_v$version"
              $tagSha = ((git ls-remote origin "refs/tags/$tag") -split '\s+')[0]
              if ((git rev-parse 'HEAD^') -ne $env:GITHUB_SHA -or $tagSha -ne $remoteHead) {
                throw "$branch has moved since $env:GITHUB_SHA. Start a new release run from the latest commit."
              }
            }
            # changeset publish skips versions that are already on npm.
            pnpm publish-packages
          }
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPMJS_PUBLISH_ITWIN }}
