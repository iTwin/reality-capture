name: (RCPackPublish) Pack and publish reality-capture GitHub release

on:
  workflow_call:
    inputs:
      prerelease:
        required: true
        type: boolean

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Checkout github repo (+ download lfs dependencies)
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Checkout LFS objects
        run: git lfs checkout

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        working-directory: ./typescript/packages/reality-capture
        run: pnpm install --frozen-lockfile=true

      - name: Build
        working-directory: ./typescript/packages/reality-capture
        run: pnpm build

      - name: Publish packages in npm
        working-directory: ./typescript/packages/reality-capture
        shell: pwsh
        run: |
          git config --local user.email imodeljs-admin@users.noreply.github.com
          git config --local user.name imodeljs-admin
          # beachball resolves --config from the git root, not the current directory,
          # so an absolute path is required to load the package-local config.
          $configName = if ("${{ inputs.prerelease }}" -eq "true") { "beachball.config.dev.js" } else { "beachball.config.js" }
          $configPath = Join-Path "${{ github.workspace }}" "typescript/packages/reality-capture/$configName"
          if ("${{ inputs.prerelease }}" -eq "true") {
            pnpm exec beachball publish --config "$configPath" --keep-change-files -y --branch origin/${{ github.ref_name }} --message "Version bump [skip actions]"
          }
          else {
            pnpm exec beachball publish --config "$configPath" -y --branch origin/${{ github.ref_name }} --message "Version bump [skip actions]"
          }
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPMJS_PUBLISH_ITWIN }}
