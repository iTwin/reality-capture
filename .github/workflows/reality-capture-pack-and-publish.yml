name: (RCPackPublish) Pack and publish reality-capture GitHub release

on:
  workflow_call:
    inputs:
      prerelease:
        required: true
        type: boolean

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Checkout github repo (+ download lfs dependencies)
        uses: actions/checkout@v5
        with:
          lfs: true
          token: ${{ secrets.RELEASE_PAT || secrets.IMJS_ADMIN_GH_TOKEN }}

      - name: Checkout LFS objects
        run: git lfs checkout

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        working-directory: ./typescript/packages/reality-capture
        run: pnpm install --frozen-lockfile=true

      - name: Build
        working-directory: ./typescript/packages/reality-capture
        run: pnpm build

      - name: Bump version, tag and push to git (no npm publish)
        working-directory: ./typescript/packages/reality-capture
        shell: pwsh
        run: |
          git config --local user.email imodeljs-admin@users.noreply.github.com
          git config --local user.name imodeljs-admin
          # Without change files there is nothing to bump: this happens when a previous run
          # already pushed the bump and only the npm publish is missing.
          $changeFiles = Get-ChildItem -Path "${{ github.workspace }}/change" -Filter "*.json" -ErrorAction SilentlyContinue
          if (-not $changeFiles) {
            Write-Host "No change files found: skipping version bump and push."
            exit 0
          }
          # beachball resolves --config from the git root, not the current directory,
          # so an absolute path is required to load the package-local config.
          $configName = if ("${{ inputs.prerelease }}" -eq "true") { "beachball.config.dev.js" } else { "beachball.config.js" }
          $configPath = Join-Path "${{ github.workspace }}" "typescript/packages/reality-capture/$configName"
          $extraArgs = @()
          if ("${{ inputs.prerelease }}" -eq "true") { $extraArgs += "--keep-change-files" }
          pnpm exec beachball publish --no-publish --config "$configPath" @extraArgs -y --branch origin/${{ github.ref_name }} --message "Version bump [skip actions]"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish package in npm
        working-directory: ./typescript/packages/reality-capture
        shell: pwsh
        run: |
          # beachball pushed a commit on top of the checked out one: use the version it wrote.
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $name = $package.name
          $version = $package.version
          $tag = if ("${{ inputs.prerelease }}" -eq "true") { "nightly" } else { "latest" }
          $published = npm view "$name@$version" version 2>$null
          if ($published) {
            Write-Host "$name@$version is already published on npm: nothing to do."
            exit 0
          }
          Write-Host "Publishing $name@$version with tag '$tag'"
          pnpm publish --access public --tag $tag --no-git-checks
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPMJS_PUBLISH_ITWIN }}
